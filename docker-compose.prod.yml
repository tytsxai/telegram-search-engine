version: "3.8"

services:
  meilisearch:
    env_file:
      - .env.production
    environment:
      - MEILI_ENV=production
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7700/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  redis:
    env_file:
      - .env.production
    command:
      [
        "/bin/sh",
        "-c",
        "exec redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass \"$${REDIS_PASSWORD}\"",
      ]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  crawler:
    build:
      context: .
      dockerfile: Dockerfile.crawler
    env_file:
      - .env.production
    environment:
      - APP_ENV=production
      - TELEGRAM_SESSION_PATH=/data/telegram/session
      - STATE_FILE_PATH=/data/state.json
      - CHANNELS_CONFIG_PATH=/data/channels.json
    volumes:
      - crawler_data:/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "-m", "telegram_search.health", "--component", "crawler"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    depends_on:
      meilisearch:
        condition: service_healthy

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    env_file:
      - .env.production
    environment:
      - APP_ENV=production
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    healthcheck:
      test: ["CMD", "python", "-m", "telegram_search.health", "--component", "bot"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    depends_on:
      meilisearch:
        condition: service_healthy

volumes:
  crawler_data:
