[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-search-engine"
version = "0.1.0"
description = "Self-hosted Telegram channel crawler and Meilisearch full-text search with Chinese NLP (jieba, pinyin, OpenCC)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "tytsxai" }]
keywords = [
    "telegram",
    "search",
    "meilisearch",
    "telethon",
    "crawler",
    "jieba",
    "pinyin",
    "full-text",
    "chinese",
    "self-hosted",
    "全文搜索",
]
dependencies = [
    "python-telegram-bot>=21.0",
    "meilisearch>=0.31.0",
    "telethon>=1.34.0",
    "jieba>=0.42.1",
    "pypinyin>=0.51.0",
    "opencc-python-reimplemented>=0.1.7",
    "simhash>=2.1.2",
    "redis>=5.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "tomli>=2.0.1",
    "aiohttp>=3.9.0",
    "structlog>=24.1.0",
]

[project.urls]
Homepage = "https://github.com/tytsxai/tg-search-engine"
Repository = "https://github.com/tytsxai/tg-search-engine"
Documentation = "https://github.com/tytsxai/tg-search-engine/tree/main/docs"
Changelog = "https://github.com/tytsxai/tg-search-engine/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=telegram_search --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.setuptools.packages.find]
include = ["telegram_search*", "apps*"]
